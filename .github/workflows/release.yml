name: Release

# Publishes all packages to NuGet.org when a version tag is pushed:
#
#   git tag v10.6.0
#   git push origin v10.6.0
#
# The package version is taken from the tag (v10.6.0 -> 10.6.0) and passed to
# MSBuild as -p:Version, overriding the default in src/Directory.Build.props.
#
# Publishing uses NuGet Trusted Publishing (OIDC): no long-lived API key is
# stored in the repository. A Trusted Publisher policy must exist on NuGet.org
# for the package owner (andrey-gubskiy) pointing at udndc/X.PagedList and this
# workflow file (release.yml), scoped to the glob pattern "X.PagedList*".
# NuGet/login exchanges the GitHub OIDC token for a short-lived NuGet API key.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # required to request the GitHub OIDC token for NuGet Trusted Publishing

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  release:
    name: Pack and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for SourceLink

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Resolve version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a SemVer 2.0 version tag (expected e.g. v10.6.0)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION"

      - name: Restore
        run: dotnet restore X.PagedList.slnx

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet build X.PagedList.slnx -c Release --no-restore -p:Version="$VERSION"

      - name: Test
        run: dotnet test tests/X.PagedList.Tests/X.PagedList.Tests.csproj -c Release --no-build

      - name: Pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for project in src/*/*.csproj; do
            dotnet pack "$project" -c Release --no-build -o ./artifacts -p:Version="$VERSION"
          done
          ls -1 ./artifacts

      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: andrey-gubskiy

      # dotnet nuget push uploads the matching .snupkg symbol package next to
      # each .nupkg automatically, so a single push publishes both.
      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >-
          dotnet nuget push ./artifacts/*.nupkg
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
