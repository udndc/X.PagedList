name: Release

# Publishes all packages to NuGet.org when a version tag is pushed:
#
#   git tag v10.6.0
#   git push origin v10.6.0
#
# The package version is taken from the tag (v10.6.0 -> 10.6.0) and passed to
# MSBuild as -p:Version, overriding the default in src/Directory.Build.props.
#
# Required secret: NUGET_API_KEY (Settings -> Secrets and variables -> Actions).
# The key on NuGet.org should be scoped to the glob pattern "X.PagedList*"
# with the "Push new packages and package versions" permission only.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  release:
    name: Pack and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for SourceLink

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Resolve version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a SemVer 2.0 version tag (expected e.g. v10.6.0)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION"

      - name: Restore
        run: dotnet restore X.PagedList.slnx

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet build X.PagedList.slnx -c Release --no-restore -p:Version="$VERSION"

      - name: Test
        run: dotnet test tests/X.PagedList.Tests/X.PagedList.Tests.csproj -c Release --no-build

      - name: Pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for project in src/*/*.csproj; do
            dotnet pack "$project" -c Release --no-build -o ./artifacts -p:Version="$VERSION"
          done
          ls -1 ./artifacts

      # dotnet nuget push uploads the matching .snupkg symbol package next to
      # each .nupkg automatically, so a single push publishes both.
      - name: Push to NuGet.org
        run: >-
          dotnet nuget push ./artifacts/*.nupkg
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
